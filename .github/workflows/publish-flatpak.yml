name: Publish Flatpak

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2) -- this file just keeps mariner's own
# trigger policy, which genuinely differs from other tuna-os app repos:
# PR-triggered build-only validation, so a broken aarch64 leg can't merge to
# master without being caught (see tunaos history: one stayed red 5 weeks).

on:
  push:
    # Both names while the default branch is being renamed master -> main.
    # Drop `master` once the rename has landed.
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GHCR and update the central index (leave off for a build-only validation run)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests get a build-only run with a read-only token. The token
  # secret is still passed because the shared reusable workflow marks it
  # required and fails to start without it; the publish/index steps are
  # gated off by publish: false.
  # This stays on the older reusable commit: later ones grant their publish
  # and release-bundles jobs write scopes, which a read-only caller can't
  # allow, so the run would fail to start. It never pushes the index, so it
  # doesn't need the deploy key the publish job below uses.
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@c9f1efaa0b84849b955b7deee47a8401234564c2
    with:
      app-id: org.tunaos.mariner
      manifest-path: org.tunaos.mariner.json
      repo-name: tuna-os/mariner
      publish: false
    secrets:
      FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}

  publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    # At or after tuna-os/.github#360: pushes the central index with the
    # FLATPAK_INDEX_DEPLOY_KEY org secret (FLATPAK_INDEX_TOKEN is the fallback
    # it reads when the key is absent). These are the only secrets it declares.
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@4078f531ac74703f203bde835ef6c25e9321b97b # main # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead
    with:
      app-id: org.tunaos.mariner
      manifest-path: org.tunaos.mariner.json
      repo-name: tuna-os/mariner
      # Not `A && B || C` -- if B (inputs.publish) is false, that's falsy,
      # so `||` would silently fall through to C and publish anyway.
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    secrets:
      FLATPAK_INDEX_DEPLOY_KEY: ${{ secrets.FLATPAK_INDEX_DEPLOY_KEY }}
      FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
