name: CI

# package.json has declared `test` (`node --test tests/*.test.ts`) and
# `typecheck` (`tsc --noEmit`) since the repo was forked, and biome.json has
# configured a formatter and linter for just as long; publish-flatpak builds,
# screenshots photographs the published app, sync-upstream merges. This
# workflow is where all three are gated: unit tests, `npm run typecheck`, and
# biome. Before, type errors surfaced only as a Flatpak build failure, minutes
# and a lot of unrelated machinery away from the mistake, and biome ran
# nowhere at all.

on:
  push:
    # Both names while the default branch is being renamed master -> main.
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pinned to the Node the Flatpak actually ships (see the nodejs module
      # in org.tunaos.mariner.json) so the tests run against the runtime
      # users get. It also has to be >= 22.18, where type stripping became
      # available without a flag — the tests import src/core/*.ts directly.
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.23.1

      # No install step, deliberately. tests/ imports pure-logic modules from
      # src/core and src/services, none of which touch node-gtk, so the suite
      # runs with an empty node_modules in well under a second. Adding an
      # `npm install` here would pull node-gtk's native build into a job that
      # does not need it.
      # V8 coverage (lcov + HTML report) is uploaded as an artifact so unit
      # coverage for the exact revision is reproducible from CI. Retention is
      # the 90-day default, pinned explicit for auditability.
      - name: Run the unit tests with coverage
        env:
          NODE_V8_COVERAGE: coverage
        run: node --test --experimental-test-coverage tests/*.test.ts

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 90

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.23.1

      # `--ignore-scripts` on purpose: node-gtk's install script compiles
      # native bindings against GTK4 and gobject-introspection, which this job
      # has no use for and the runner does not have. tsc never reads the
      # package either — tsconfig includes only `src`, and `src/gi.d.ts`
      # declares the `gi:` namespaces locally — so typescript and @types/node
      # are the whole dependency surface of `npm run typecheck`.
      - name: Install dependencies without building node-gtk
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: Biome
    runs-on: ubuntu-24.04
    steps:
      # Full history: the biome step diffs against the base of the change.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.23.1

      # Scoped to the files the change touches, not the whole tree. biome has
      # never run here, so master carries a backlog of diagnostics (271 lines
      # alone are over biome.json's 100-column limit); reformatting the tree to
      # turn this job green would rewrite code upstream romgrk/mariner also
      # owns, and sync-upstream.yml merges that upstream daily — the standing
      # rule in AGENTS.md is that such rewrites buy a merge conflict every time
      # upstream touches the file. So new and modified code is enforced and the
      # backlog is burned down separately.
      #
      # Version pinned to biome.json's `$schema`, so the config and the binary
      # checking against it cannot drift apart. `biome ci` never writes: it
      # checks formatting, lint rules and import order, and exits non-zero on
      # any diagnostic.
      - name: Biome-check the files this change touches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          # `github.event.before` is all-zeros for a branch's first push, and
          # absent entirely for workflow_dispatch; fall back to the parent
          # commit, which is the right base for a merge_group run too.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify --quiet HEAD^ || true)"
          fi
          if [ -z "$base" ]; then
            echo "No comparison base for this event; nothing to check."
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=ACMR "${base}...HEAD" -- src tests | grep -E '\.ts$' || true)"
          if [ -z "$files" ]; then
            echo "No TypeScript files changed against ${base}."
            exit 0
          fi
          echo "$files"
          # shellcheck disable=SC2086 # paths are git-reported, newline-split on purpose
          npx --yes @biomejs/biome@1.9.4 ci $files

  # The two suites below import `gi:` modules, so they need node-gtk's native
  # addon and the system GTK4/GObject-Introspection libraries. The `test` job
  # deliberately has neither, so both suites always skip there and a
  # regression in the BigInt sort or the thumbnail cache bound would ship
  # with a green check. This job runs them for real and fails if either one
  # skips again (typelib drift, a failed addon build).
  gtk-tests:
    name: GTK-dependent unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.23.1

      # The build dependencies packaging/aur/PKGBUILD lists for node-gtk.
      - name: Install GTK4 and GObject-Introspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev gir1.2-gtk-4.0 \
            libgirepository1.0-dev gobject-introspection libcairo2-dev \
            libglib2.0-dev pkg-config python3 build-essential xvfb

      # No --ignore-scripts here: node-gtk's install script is the point.
      - name: Install dependencies and build node-gtk
        run: npm ci --no-fund --no-audit

      # TAP output marks a skipped suite with `# SKIP`, while the summary line
      # says `skipped 0` whatever happened, so the grep is the real check.
      - name: Run the gi:-dependent suites and fail on any skip
        run: |
          set -euo pipefail
          xvfb-run -a node --import node-gtk/register --test \
            --test-reporter=tap \
            tests/comparator.test.ts tests/thumbnail-service.test.ts | tee gtk-tests.tap
          if grep -E '# SKIP' gtk-tests.tap; then
            echo "::error::a gi:-dependent suite skipped; it must run in this job"
            exit 1
          fi

  required-checks:
    if: always()
    needs: [test, typecheck, lint, gtk-tests]
    runs-on: ubuntu-24.04
    steps:
      # Every gate named individually, so adding a job above without adding it
      # here cannot silently leave it ungated.
      - name: Verify required validation passed
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.gtk-tests.result }}" = success
