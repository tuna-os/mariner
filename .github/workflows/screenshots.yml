name: Screenshots

# Photographs the app as it actually ships: installs the published Flatpak
# from the tuna-os remote and captures that, rather than building a
# development copy. Mariner is node-gtk, so a from-source build in CI means
# native bindings against GTK4 and gobject-introspection -- a lot of moving
# parts between a code change and a picture, none of which the screenshot
# needs. It also means the image shows the artifact users install, so a
# packaging regression shows up here.
on:
  pull_request:
    paths:
      - "data/org.tunaos.mariner.metainfo.xml"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    # Not a container: Flatpak needs bubblewrap, which wants privileges the
    # job container does not have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak

      - name: Install the published app
        run: |
          # Flathub too: the app's runtime (org.gnome.Platform) lives there,
          # and the tuna-os remote carries only the apps.
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists \
            tuna-os https://tunaos.org/flatpak/tuna-os.flatpakrepo
          flatpak install --user -y tuna-os org.tunaos.mariner
          flatpak info --user org.tunaos.mariner

      # A file manager photographed against an empty home directory shows an
      # empty window. Give it something ordinary to display.
      - name: Give the file manager something to show
        run: |
          mkdir -p ~/Documents ~/Pictures ~/Downloads ~/Music ~/Videos
          mkdir -p ~/Documents/{Invoices,Notes,Reports}
          for f in budget.ods notes.md report.pdf slides.odp README.txt; do
            head -c 4096 /dev/urandom > ~/Documents/"$f"
          done

      - uses: tuna-os/flatpak-index/.github/actions/capture-screenshots@claude/sweet-gauss-5h3cma
        with:
          # --socket=x11 so the sandbox can see the Xvfb the action started.
          command: flatpak run --user --socket=x11 org.tunaos.mariner
          name: main-window
          out-dir: docs/screenshots
          settle: "10"

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/
