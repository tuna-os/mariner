name: Publish Flatpak

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2) -- this file just keeps mariner's own
# trigger policy, which genuinely differs from other tuna-os app repos:
# PR-triggered build-only validation, so a broken aarch64 leg can't merge to
# master without being caught (see tunaos history: one stayed red 5 weeks).

on:
  push:
    # Both names while the default branch is being renamed master -> main.
    # Drop `master` once the rename has landed.
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GHCR and update the central index (leave off for a build-only validation run)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests get a build-only run: publish: false gates off the GHCR
  # push, the index update and the release upload, and no secret is passed.
  # Same reusable commit as the publish job, so a PR builds exactly what
  # master will publish -- including the flatpak-copy-up step that keeps the
  # x86_64 build working on runner hosts whose overlayfs returns EXDEV.
  #
  # Why this grants write scopes on a pull request: GitHub refuses to start a
  # called workflow if any of its jobs declares more than the caller allows,
  # even a job its `if:` skips, and the reusable workflow's publish and
  # release-bundles jobs declare packages: write / contents: write. These
  # are only a ceiling. The job that runs PR code, build-oci, takes the
  # reusable workflow's top-level `contents: read`, and the two write jobs
  # never run with publish: false. Fork PRs get a read-only token anyway.
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      packages: write
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@1ad6fffee8ef4ce504d6e14dc7aa7ac8318984bd # main # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead
    with:
      app-id: org.tunaos.mariner
      manifest-path: org.tunaos.mariner.json
      repo-name: tuna-os/mariner
      publish: false

  publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    # At or after tuna-os/.github#360: pushes the central index with the
    # FLATPAK_INDEX_DEPLOY_KEY org secret (FLATPAK_INDEX_TOKEN is the fallback
    # it reads when the key is absent). These are the only secrets it declares.
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@1ad6fffee8ef4ce504d6e14dc7aa7ac8318984bd # main # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead
    with:
      app-id: org.tunaos.mariner
      manifest-path: org.tunaos.mariner.json
      repo-name: tuna-os/mariner
      # Not `A && B || C` -- if B (inputs.publish) is false, that's falsy,
      # so `||` would silently fall through to C and publish anyway.
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    secrets:
      FLATPAK_INDEX_DEPLOY_KEY: ${{ secrets.FLATPAK_INDEX_DEPLOY_KEY }}
      FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
