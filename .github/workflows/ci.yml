name: CI

# Keep fast source validation here. Flatpak packaging also type-checks as part
# of its build, but that job is slower and tests unrelated packaging machinery.

on:
  push:
    # Both names while the default branch is being renamed master -> main.
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          cache: npm

      # TypeScript needs the package declarations, but neither check needs
      # node-gtk's native install script or GTK build dependencies.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Biome checks
        run: npx --yes @biomejs/biome@1.9.4 check .

      - name: Run TypeScript type-check
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Pinned to the Node the Flatpak actually ships (see the nodejs module
      # in org.tunaos.mariner.json) so the tests run against the runtime
      # users get. It also has to be >= 22.18, where type stripping became
      # available without a flag — the tests import src/core/*.ts directly.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1

      # No install step, deliberately. tests/ imports pure-logic modules from
      # src/core and src/services, none of which touch node-gtk, so the suite
      # runs with an empty node_modules in well under a second. Adding an
      # `npm install` here would pull node-gtk's native build into a job that
      # does not need it.
      # V8 coverage (lcov + HTML report) is uploaded as an artifact so unit
      # coverage for the exact revision is reproducible from CI. Retention is
      # the 90-day default, pinned explicit for auditability.
      - name: Run the unit tests with coverage
        env:
          NODE_V8_COVERAGE: coverage
        run: node --test --experimental-test-coverage tests/*.test.ts

      - name: Upload unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 90

  required-checks:
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required validation passed
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.test.result }}" = success
