name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: extractions/setup-just@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run local-equivalent checks
        run: just check

  required-checks:
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify validation passed
        run: test "${{ needs.validate.result }}" = success
