name: Publish Flatpak

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2) -- this file just keeps mariner's own
# trigger policy, which genuinely differs from other tuna-os app repos:
# PR-triggered build-only validation, so a broken aarch64 leg can't merge to
# master without being caught (see tunaos history: one stayed red 5 weeks).

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GHCR and update the central index (leave off for a build-only validation run)
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    # TEMP: pinned to the validation branch while tuna-os/.github#41 is
    # unmerged. Switch to @main once that lands.
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@feat/reusable-publish-flatpak
    with:
      app-id: org.tunaos.mariner
      manifest-path: org.tunaos.mariner.json
      repo-name: tuna-os/mariner
      # Not `A && B || C` -- if B (inputs.publish) is false, that's falsy,
      # so `||` would silently fall through to C and publish anyway. Confirmed
      # by testing: a workflow_dispatch with publish=false still published.
      publish: ${{ (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    secrets: inherit
